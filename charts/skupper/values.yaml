controller:
  image: quay.io/skupper/controller
  # -- Default to appVersion if tag is not set
  tag: ""
  # -- Arguments for the controller
args:
  - -enable-grants
  - -grant-server-autoconfigure
kubeAdaptor:
  image: quay.io/skupper/kube-adaptor
  # -- Default to appVersion if tag is not set
  tag: ""
routerImage:
  image: quay.io/skupper/skupper-router
  tag: 3.5.2

# -- Available options: cluster, namespace
scope: cluster

# -- IP or hostname of any cluster node. Required when 'nodeport' is in enabledAccessTypes.
clusterHost: ""
# -- Comma-separated list of enabled access types. Supported: local, loadbalancer,
#    route, nodeport, ingress, ingress-nginx, contour-http-proxy, gateway
enabledAccessTypes: "local,loadbalancer,route"
# -- Default access type when a Site omits one. Empty = controller auto-selects (route on OpenShift, else loadbalancer).
defaultAccessType: ""
# -- IngressClass for Skupper-managed Ingress resources when 'ingress' or 'ingress-nginx' is used.
#    Empty = controller default (for ingress-nginx, defaults to "nginx").
ingressClassName: ""

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []

# -- Tolerations for the skupper-controller deployment
tolerations: []
# Example:
# tolerations:
#   - key: "key1"
#     operator: "Equal"
#     value: "value1"
#     effect: "NoSchedule"

# -- Affinity rules for the skupper-controller deployment
affinity: {}
# Example for pod anti-affinity to avoid scheduling multiple pods on the same node:
# affinity:
#   podAntiAffinity:
#     requiredDuringSchedulingIgnoredDuringExecution:
#       - labelSelector:
#           matchExpressions:
#             - key: application
#               operator: In
#               values:
#                 - skupper-controller
#         topologyKey: kubernetes.io/hostname
